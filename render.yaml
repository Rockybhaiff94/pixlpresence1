services:
  # Pixel.gg Central Consolidated Backend Service (API + Discord Bot)
  - type: web
    name: pixelgg-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run generate --workspace=@discord-rpc/database && npm run build --workspace=@discord-rpc/database && npm run build --workspace=bot && npm run build --workspace=api
    startCommand: npm start --workspace=api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://pixlpresence1-web.vercel.app
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_CALLBACK_URL
        value: https://pixelgg-api.onrender.com/auth/discord/callback
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: BOT_ACTIVITY_NAME
        value: Pixel.gg Profiles
      - key: BOT_ACTIVITY_TYPE
        value: WATCHING
      - key: BOT_STATUS
        value: online
