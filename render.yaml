services:
  # API Web Service
  - type: web
    name: pixelgg-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run generate --workspace=@discord-rpc/database && npm run db:push --workspace=@discord-rpc/database && npm run build --workspace=@discord-rpc/database && npm run build --workspace=api
    startCommand: npm start --workspace=api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://postgres.zvebxnogbidjjnuelpec:tHpg8oylNnBdwEU5@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true
      - key: DIRECT_URL
        value: postgresql://postgres.zvebxnogbidjjnuelpec:tHpg8oylNnBdwEU5@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://pixlpresence1-web.vercel.app
      - key: DISCORD_CLIENT_ID
        value: "1523632136878559302"
      - key: DISCORD_CLIENT_SECRET
        value: 2MbiMbAAS3S333QmWMPSVUDoBT0hAZPh
      - key: DISCORD_CALLBACK_URL
        value: https://pixlpresence1.onrender.com/auth/discord/callback
      - key: ADMIN_DISCORD_IDS
        value: "704548873145942076"

  # Bot Background Worker
  - type: worker
    name: pixelgg-bot
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run generate --workspace=@discord-rpc/database && npm run build --workspace=@discord-rpc/database && npm run build --workspace=bot
    startCommand: npm start --workspace=bot
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://postgres.zvebxnogbidjjnuelpec:tHpg8oylNnBdwEU5@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true
      - key: DISCORD_BOT_TOKEN
        sync: false
